<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de máquina de anestesia</title>

<script>
/* Cargador de recursos.
   ---------------------------------------------------------------------
   Los archivos se piden con un numero de version pegado a la direccion.
   Al cambiar VERSION, el navegador los considera direcciones distintas y
   los vuelve a pedir, en vez de usar los que tiene guardados.

   Hace falta porque el navegador guarda cada archivo por separado: puede
   servir un ui.js nuevo junto a un maquinaVista.js viejo, y entonces la
   pagina no se ve vieja, se rompe. Por si aun asi ocurriera, al terminar
   de cargar se comprueba que cada modulo traiga las funciones que la
   interfaz necesita, y si falta alguna se avisa en pantalla con la
   solucion, en vez de dejar una pagina muerta.

   AL PUBLICAR UNA VERSION NUEVA: cambiar la fecha de VERSION. Es lo
   unico que hay que tocar en este archivo. Ver PUBLICAR.md.             */
(function () {
  var VERSION = '2026-11-23';

  var MODULOS = ['perfil', 'modelo', 'maquina', 'alarmas', 'escenarios', 'modulos',
                 'maquinaVista', 'maquinaPortada', 'esquema', 'monitor', 'tutorial', 'ui'];

  /* Funciones que la interfaz usa de cada modulo. Si falta alguna, lo que
     se cargo no es el conjunto que va junto. */
  var EXIGE = {
    maquinaVista: ['markup', 'vineta'],
    maquinaPortada: ['markup'],
    esquema:      ['markup'],
    monitor:      ['dibujarPar'],
    ui:           ['renderInicio', 'renderSimulacion', 'refrescar'],
    escenarios:   ['porId'],
    maquina:      ['estadoInicial', 'calcular'],
    alarmas:      ['evaluar'],
    tutorial:     ['hay'],
    modulos:      ['porId']
  };

  var hoja = document.createElement('link');
  hoja.rel = 'stylesheet';
  hoja.href = 'css/estilos.css?v=' + VERSION;
  document.head.appendChild(hoja);

  function avisar(titulo, detalle) {
    function pintar() {
      var c = document.getElementById('app') || document.body;
      c.innerHTML =
        '<div style="max-width:620px;margin:14vh auto;padding:0 24px;' +
        'font:15px/1.6 system-ui,Segoe UI,Roboto,sans-serif;color:#e9ebec;">' +
          '<h1 style="font-size:20px;margin:0 0 14px;font-weight:600;">' + titulo + '</h1>' +
          '<p style="margin:0 0 14px;color:#a6abaf;">' + detalle + '</p>' +
          '<p style="margin:0;color:#a6abaf;">Recarga la pagina forzando la descarga: ' +
            '<b style="color:#e9ebec;">Ctrl + Shift + R</b> en Windows y Linux, ' +
            '<b style="color:#e9ebec;">Cmd + Shift + R</b> en Mac.</p>' +
        '</div>';
      document.body.style.background = '#17181a';
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', pintar);
    } else {
      pintar();
    }
  }

  function cargar(ruta, alTerminar) {
    var s = document.createElement('script');
    s.src = ruta + '?v=' + VERSION;
    s.async = false;   /* conserva el orden de ejecucion entre archivos */
    if (alTerminar) { s.onload = alTerminar; }
    s.onerror = function () {
      avisar('No se pudo cargar el simulador',
             'Falta el archivo <code>' + ruta + '</code>. Si acabas de publicar una ' +
             'version, puede que ese archivo no se haya subido.');
    };
    document.head.appendChild(s);
  }

  function revisarYArrancar() {
    var faltan = [], m, i;
    for (m in EXIGE) {
      if (!Object.prototype.hasOwnProperty.call(EXIGE, m)) { continue; }
      for (i = 0; i < EXIGE[m].length; i++) {
        if (!window.SIM || !window.SIM[m] || typeof window.SIM[m][EXIGE[m][i]] !== 'function') {
          faltan.push(m + '.' + EXIGE[m][i] + '()');
        }
      }
    }
    if (faltan.length) {
      avisar('El simulador se cargo incompleto',
             'Falta ' + (faltan.length === 1 ? 'una funcion' : faltan.length + ' funciones') +
             ': <code>' + faltan.join('</code>, <code>') + '</code>. ' +
             'O el navegador junto archivos de dos versiones distintas, o alguno no llego. ' +
             'Si acabas de publicar una version, revisa que se hayan subido las carpetas ' +
             '<code>css</code> y <code>js</code> completas.');
      return;
    }
    cargar('js/app.js');
  }

  for (var i = 0; i < MODULOS.length; i++) {
    cargar('js/' + MODULOS[i] + '.js',
           i === MODULOS.length - 1 ? revisarYArrancar : null);
  }
})();
</script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p style="font:15px/1.6 system-ui;color:#e9ebec;background:#17181a;padding:24px;">
      Este simulador necesita JavaScript activado.
    </p>
  </noscript>
</body>
</html>
